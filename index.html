        const compressImage = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 600; 
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX/w; w = MAX; } } else { if (h > MAX) { w *= MAX/h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = () => reject(new Error("Image invalide"));

        // --- STREAMING_CHUNK:Defining Charts... ---
        const SpiderChart = ({ data }) => {

            const maxVal = Math.max(...Object.values(data), 100);
            const pts = labels.map((l, i) => { const a = (Math.PI*2*i)/labels.length - Math.PI/2; const r = ((data[l]||0)/maxVal)*radius; return `${center + r*Math.cos(a)},${center + r*Math.sin(a)}`; }).join(' ');
            return (
                <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                    {[0.25, 0.5, 0.75, 1].map(l => <polygon key={l} points={labels.map((_, i) => { const a = (Math.PI*2*i)/labels.length - Math.PI/2; const r = radius*l; return `${center+r*Math.cos(a)},${center+r*Math.sin(a)}`; }).join(' ')} fill="none" stroke="#e5e7eb" strokeWidth="1" />)}
                    {labels.map((_, i) => { const a = (Math.PI*2*i)/labels.length - Math.PI/2; return <line key={i} x1={center} y1={center} x2={center+radius*Math.cos(a)} y2={center+radius*Math.sin(a)} stroke="#e5e7eb" strokeWidth="1" />; })}
                    <polygon points={pts} fill="rgba(250, 204, 21, 0.5)" stroke="#FACC15" strokeWidth="2" />
                    <g transform={`translate(${center-12},${center-12})`}><DuckIcon size={24}/></g>
                    {labels.map((l, i) => { const a = (Math.PI*2*i)/labels.length - Math.PI/2; const x = center + (radius+25)*Math.cos(a); const y = center + (radius+25)*Math.sin(a); return <text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="middle" className="text-[10px] fill-gray-500 font-bold">{l.split(' ')[0].substring(0,8)}</text>; })}

            const w = 300, h = 200, pad = 25;

            const getX = i => pad + (i / Math.max(data.length - 1, 1)) * (w - 2 * pad);
            const getY = wg => h - pad - (wg / maxW) * (h - 2 * pad);
            
            return (
                <div className="w-full overflow-hidden bg-gray-50 rounded-lg border border-gray-100 relative">
                    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
                        {[0, maxW/2, maxW].map((wg, i) => (
                            <g key={i}>
                                <line x1={pad} y1={getY(wg)} x2={w-pad} y2={getY(wg)} stroke="#e5e7eb" strokeWidth="1" />
                                <text x={pad-2} y={getY(wg)+3} textAnchor="end" fontSize="8" fill="#9ca3af">{Math.round(wg)}</text>
                            </g>
                        ))}
                        <text x={w/2} y={h-5} textAnchor="middle" fontSize="10" fill="#9ca3af">Temps (Évolution des séances)</text>
                        {data.length > 1 && <polyline points={data.map((d, i) => `${getX(i)},${getY(d.weight)}`).join(' ')} fill="none" stroke="#FACC15" strokeWidth="2" />}
                        {data.map((d, i) => (
                            <circle key={i} cx={getX(i)} cy={getY(d.weight)} r="4" fill="#FACC15" stroke="black" strokeWidth="1">
                                <title>{d.weight}kg x {d.reps} ({new Date(d.date?.seconds*1000).toLocaleDateString()})</title>
                            </circle>
                        ))}
                    </svg>
                </div>
            );
        };

        const IntensityChart = ({ validations }) => {
            const w = 300, h = 150, pad = 20;
            const sorted = [...validations].sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)).filter(v => v.intensity);
            if (sorted.length < 2) return <div className="text-center text-sm text-gray-400 py-4">Pas assez de données</div>;
            
            const getX = i => pad + (i / (sorted.length - 1)) * (w - 2*pad);
            const getY = val => h - pad - ((val - 1) / 9) * (h - 2*pad);
            const pts = sorted.map((v, i) => `${getX(i)},${getY(v.intensity)}`).join(' ');

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto bg-gray-50 rounded-lg border border-gray-100">
                    {[1, 5, 10].map(y => <line key={y} x1={pad} y1={getY(y)} x2={w-pad} y2={getY(y)} stroke="#e5e7eb" strokeWidth="1"/>)}
                    <text x={5} y={getY(10)+5} fontSize="8" fill="#9ca3af">10</text>
                    <text x={5} y={getY(1)+5} fontSize="8" fill="#9ca3af">1</text>
                    <polyline points={pts} fill="none" stroke="#EF4444" strokeWidth="2" />
                    {sorted.map((v, i) => <circle key={i} cx={getX(i)} cy={getY(v.intensity)} r="3" fill="#EF4444"><title>Intensité: {v.intensity}</title></circle>)}
                </svg>
            );
        };

        // --- STREAMING_CHUNK:Defining PB and Leaderboard... ---
        const PBSection = ({ currentUser, isDaddyDuck, db, notify }) => {
            const { getDocs, query, collection, onSnapshot, where, addDoc, Timestamp } = window.firebaseModules;
            
            const [ex, setEx] = useState(EXERCISES_LIST[0]);
            const [dynamicExList, setDynamicExList] = useState(EXERCISES_LIST);
            const [spider, setSpider] = useState({});
            const [users, setUsers] = useState([]);
            const [target, setTarget] = useState(currentUser);
            const [allVals, setAllVals] = useState([]);
            const [allPbs, setAllPbs] = useState([]);

            const [w, setW] = useState('');
            const [r, setR] = useState('');
            const [d, setD] = useState(new Date().toISOString().split('T')[0]);
            const [isCustomEx, setIsCustomEx] = useState(false);
            const [customEx, setCustomEx] = useState('');

            useEffect(() => {
                if (isDaddyDuck) {
                    getDocs(query(collection(db, 'duck_users'))).then(s => {
                        const l = s.docs.map(docSnap => docSnap.data().name); setUsers(l); if (l.length && target === 'Daddy Duck') setTarget(l[0]);
                    });
                } else setTarget(currentUser);
            }, [isDaddyDuck]);

            useEffect(() => {
                if (!target) return;
                const unsubPB = onSnapshot(query(collection(db, 'duck_pbs'), where('userLowName', '==', target.toLowerCase())), (s) => {
                    const all = s.docs.map(d => d.data());
                    setAllPbs(all);
                    
                    const uniqueExs = Array.from(new Set([...EXERCISES_LIST, ...all.map(p => p.exercise)])).sort();
                    setDynamicExList(uniqueExs);

                    const byEx = {}; EXERCISES_LIST.forEach(e => byEx[e] = 0);
                    all.forEach(p => { const s = p.weight * (p.reps || 1); if(byEx[p.exercise] !== undefined && s > byEx[p.exercise]) byEx[p.exercise] = s; });
                    setSpider(byEx);
                });
                const unsubVal = onSnapshot(query(collection(db, 'duck_validations'), where('userLowName', '==', target.toLowerCase())), (s) => {
                    setAllVals(s.docs.map(d => d.data()).filter(v => v.type === 'workout'));
                });
                return () => { unsubPB(); unsubVal(); };
            }, [target]);

            const addManualPb = async (e) => {
                e.preventDefault();
                const finalEx = isCustomEx ? customEx.trim() : ex;
                if (!finalEx || !w || !r || !d) return;
                try {
                    const dateObj = new Date(d);
                    dateObj.setHours(12, 0, 0, 0);
                    await addDoc(collection(db, 'duck_pbs'), {
                        userLowName: target.toLowerCase(),
                        exercise: finalEx,
                        weight: parseFloat(w),
                        reps: parseInt(r),
                        recordDate: d,
                        date: Timestamp.fromDate(dateObj)
                    });
                    setW(''); setR(''); setCustomEx(''); setIsCustomEx(false);
                    if(isCustomEx) setEx(finalEx);
                    notify("Performance ajoutée !", "success");
                } catch(err) {
                    notify("Erreur lors de l'ajout", "error");
                }
            };

            const hist = allPbs.filter(i => i.exercise === ex).sort((a,b) => (a.date?.seconds || 0) - (b.date?.seconds || 0));
            const currentMax = hist.length > 0 ? Math.max(...hist.map(h => h.weight)) : 0;

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center px-2">
                        <h2 className="text-2xl font-bold flex gap-2"><Icons.TrendingUp className="text-yellow-500"/> Stats</h2>
                        {isDaddyDuck && <select className="border rounded p-2" value={target} onChange={e => setTarget(e.target.value)}>{users.map((u, i) => <option key={`${u}-${i}`} value={u}>{u}</option>)}</select>}
                    </div>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm"><h3 className="text-center font-bold mb-4 text-sm text-gray-600">Forces globales (Poids x Reps)</h3><div className="flex justify-center"><SpiderChart data={spider} /></div></div>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm"><h3 className="font-bold mb-4 text-sm text-gray-600 flex items-center gap-2"><Icons.Flame size={16} className="text-red-500"/> Historique d'intensité</h3><IntensityChart validations={allVals}/></div>
                    
                    <div className="bg-white p-4 rounded-2xl border shadow-sm">
                        <h3 className="font-bold mb-4 text-sm text-gray-600 flex items-center gap-2"><Icons.Dumbbell size={16} className="text-blue-500"/> Évolution par exercice</h3>
                        
                        <select className="w-full border p-2 rounded mb-4 text-sm bg-gray-50 font-bold" value={isCustomEx ? 'custom' : ex} onChange={e => {
                            if (e.target.value === 'custom') { setIsCustomEx(true); setEx(''); }
                            else { setIsCustomEx(false); setEx(e.target.value); }
                        }}>
                            {dynamicExList.map((o, idx) => <option key={`${o}-${idx}`} value={o}>{o}</option>)}
                            <option value="custom" className="text-blue-600 font-bold">+ Nouvel exercice...</option>
                        </select>
                        
                        {!isCustomEx && (
                            hist.length > 0 ? (
                                <div>
                                    <div className="flex justify-between items-end mb-2">
                                        <span className="font-bold text-gray-800 truncate pr-2">{ex}</span>
                                        <span className="text-lg font-black text-yellow-500 shrink-0">Max: {currentMax}kg</span>
                                    </div>
                                    <ScatterChart data={hist} />
                                </div>
                            ) : (
                                <div className="text-center py-6 text-gray-400 text-sm border-2 border-dashed rounded-xl mb-4">Aucune donnée pour cet exercice</div>
                            )
                        )}

                        <div className="mt-4 pt-4 border-t border-gray-100">
                            <h4 className="font-bold text-xs text-gray-500 mb-3 flex items-center gap-1"><Icons.Plus size={14}/> Ajouter une perf manuellement</h4>
                            <form onSubmit={addManualPb} className="space-y-3">
                                {isCustomEx && <input type="text" placeholder="Nom de l'exercice personnalisé" className="w-full border p-2 rounded text-sm bg-blue-50" value={customEx} onChange={e => setCustomEx(e.target.value)} required />}
                                <div className="flex gap-2">
                                    <input type="number" step="0.5" placeholder="Poids (kg)" className="w-1/2 border p-2 rounded text-sm" value={w} onChange={e => setW(e.target.value)} required />
                                    <input type="number" placeholder="Reps" className="w-1/2 border p-2 rounded text-sm" value={r} onChange={e => setR(e.target.value)} required />
                                </div>
                                <input type="date" className="w-full border p-2 rounded text-sm text-gray-600" value={d} onChange={e => setD(e.target.value)} required />
                                <button className="w-full bg-gray-900 text-white p-2 rounded-lg font-bold text-sm hover:bg-black transition-colors">Ajouter à l'historique</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const Leaderboard = ({ db, isDaddyDuck, notify, users, setPhotoOfMonth }) => {
            const { query, collection, where, onSnapshot } = window.firebaseModules;
            const [allPhotos, setAllPhotos] = useState([]);

            useEffect(() => {
                const q = query(collection(db, 'duck_validations'), where('status', '==', 'approved'));
                return onSnapshot(q, (s) => {
                    const photos = s.docs.map(d => ({id: d.id, ...d.data()})).filter(p => p.type === 'workout');
                    photos.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                    setAllPhotos(photos);
                });
            }, [db]);

            const sportsData = {};
            allPhotos.forEach(p => { 
                const s = p.sport || 'Muscu'; 
                const uName = p.userName || 'Anonyme';
                if (!sportsData[s]) sportsData[s] = { total: 0, users: {} };
                sportsData[s].total += 1;
                sportsData[s].users[uName] = (sportsData[s].users[uName] || 0) + 1;
            });
            const sortedSports = Object.entries(sportsData).sort((a,b) => b[1].total - a[1].total);

            return (
                <div className="space-y-8">
                    <div className="space-y-4">
                        <h2 className="text-2xl font-bold px-2">Classement</h2>
                        <div className="bg-white rounded-2xl border overflow-hidden">
                            {users.map((u, i) => (
                                <div key={u.id || i} className="flex justify-between p-4 border-b">
                                    <div className="flex items-center gap-4"><span className="font-bold w-6 text-center">{i+1}</span><div className="flex items-center gap-3"><DuckAvatar id={u.avatarId} size={32}/><div><p className="font-bold">{u.name}</p><p className="text-xs text-gray-500">{u.totalWorkouts||0} séances</p></div></div></div>
                                    <div className="flex items-center gap-3"><span className="font-bold text-yellow-600 flex gap-1">{u.points} <DuckIcon size={14}/></span></div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="space-y-4">
                        <h2 className="text-2xl font-bold px-2 flex items-center gap-2">🔥 Bilan des Sports</h2>
                        <div className="bg-white rounded-2xl border p-4 space-y-4 shadow-sm">
                            {sortedSports.length === 0 && <p className="text-center text-gray-400 text-sm py-4">Aucune donnée.</p>}
                            {sortedSports.map(([sportName, data]) => {
                                const sortedUsers = Object.entries(data.users).sort((a,b) => b[1] - a[1]);
                                const maxUserCount = sortedUsers.length > 0 ? sortedUsers[0][1] : 1;
                                return (
                                    <div key={sportName} className="border-b border-gray-100 last:border-0 pb-4 last:pb-0">
                                        <h3 className="font-bold text-gray-800 flex items-center gap-2 mb-3">
                                            <span className="text-2xl">{SPORT_EMOJIS[sportName] || '🏅'}</span>
                                            <span>{sportName} <span className="text-xs text-gray-400 font-normal ml-1">({data.total} au total)</span></span>
                                        </h3>
                                        <div className="space-y-2 pl-2 sm:pl-8">
                                            {sortedUsers.map(([uName, count]) => (
                                                <div key={uName}>
                                                    <div className="flex justify-between text-xs font-bold mb-1 text-gray-600">
                                                        <span>{uName}</span>
                                                        <span className="text-yellow-600">{count} séance{count > 1 ? 's' : ''}</span>
                                                    </div>
                                                    <div className="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                                                        <div className="bg-yellow-400 h-2 rounded-full transition-all duration-1000" style={{ width: `${(count / maxUserCount) * 100}%` }}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="space-y-4">
                        <h2 className="text-2xl font-bold px-2">Galerie du mois</h2>
                        <div className="grid grid-cols-3 gap-1">
                            {allPhotos.map(p => (
                                <div key={p.id} className="relative aspect-square bg-gray-100 overflow-hidden group">
                                    <img src={p.photoBase64} alt={p.userName} className="w-full h-full object-cover" loading="lazy" />
                                    <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex flex-col justify-between p-1 transition-opacity">
                                        <div className="flex justify-end">
                                            {isDaddyDuck && (
                                                <button onClick={() => setPhotoOfMonth(p)} className="text-yellow-300 hover:text-yellow-500 bg-black/50 rounded-full p-1 m-1" title="Définir comme Coin-graphie">
                                                    <Icons.Star size={16}/>
                                                </button>
                                            )}
                                        </div>
                                        <span className="text-white text-xs font-bold truncate w-full">{p.userName}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- STREAMING_CHUNK:Defining Main App Logic... ---
        const Main = () => {
            const [fbLoaded, setFb] = useState(false);
            const [error, setError] = useState(null);
            const services = useRef({});
            
            const [user, setUser] = useState(null);
            const [username, setUsername] = useState('');
            const [userData, setUserData] = useState(null);
            const [isRegistering, setIsRegistering] = useState(false);
            
            const [activeTab, setTab] = useState('feed');
            const [notif, setNotif] = useState(null);
            const [showAvatar, setShowAvatar] = useState(false);
            
            const [allUsers, setAllUsers] = useState([]);
            const [rewards, setRewards] = useState([]);
            const [validations, setValidations] = useState([]);
            const [deliveries, setDeliveries] = useState([]);
            const [purchases, setPurchases] = useState([]);

            const [photo, setPhoto] = useState(null);
            const [intensity, setIntensity] = useState(5);
            const [sport, setSport] = useState('Muscu');
            const [fundChecked, setFundChecked] = useState({});

            const isDaddy = username.toLowerCase() === 'daddy duck';

            useEffect(() => {
                const initFirebase = () => {
                    hideFallback();
                    const { initializeApp, getApps, getAuth, getFirestore, onAuthStateChanged } = window.firebaseModules;
                    try {
                        const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        services.current = { auth, db };
                        setFb(true);
                        
                        onAuthStateChanged(auth, (u) => {
                            setUser(u);
                            if (u) {
                                if (u.displayName) setUsername(u.displayName);
                            } else {
                                setUsername('');
                                setUserData(null);
                            }
                        });
                    } catch(e) { 
                        setError("Erreur d'initialisation de la base."); 
                    }
                };
                if (window.firebaseReady) initFirebase();
                else window.addEventListener('firebase-ready', initFirebase);
            }, []);

            const notify = (msg, type = 'info') => { setNotif({ msg, type }); setTimeout(() => setNotif(null), 4000); };

            const db = services.current.db;
            const auth = services.current.auth;

            useEffect(() => {
                if(!fbLoaded || !db) return;
                const { onSnapshot, collection } = window.firebaseModules;
                const unsub = onSnapshot(collection(db, 'duck_users'), s => {
                    const u = s.docs.map(d=> ({ id: d.id, ...d.data() })).sort((a,b) => (b.totalWorkouts || 0) - (a.totalWorkouts || 0));
                    setAllUsers(u);
                });
                return () => unsub();
            }, [fbLoaded, db]);

            useEffect(() => {
                if (!user || !username || !fbLoaded || !db) return;
                const { doc, onSnapshot, updateDoc, setDoc, serverTimestamp, query, collection, where } = window.firebaseModules;
                const userRef = doc(db, 'duck_users', username.toLowerCase());
                const unsubUser = onSnapshot(userRef, (s) => {
                    if (s.exists()) {
                        const d = s.data(); setUserData(d);
                        if (!d.avatarId && !isDaddy) setShowAvatar(true);
                        
                        const now = new Date();
                        const startOfWeek = new Date(now);
                        const day = startOfWeek.getDay();
                        startOfWeek.setDate(startOfWeek.getDate() - day + (day === 0 ? -6 : 1));
                        startOfWeek.setHours(0, 0, 0, 0);

                        const startOfLastWeek = new Date(startOfWeek);
                        startOfLastWeek.setDate(startOfLastWeek.getDate() - 7);

                        let refDate = null;
                        if (d.lastWorkout) refDate = new Date(d.lastWorkout.seconds * 1000);
                        else if (d.joinedAt) refDate = new Date(d.joinedAt.seconds * 1000);

                        if (refDate) {
                            if (refDate < startOfLastWeek && d.points > 0) {
                                notify("1 semaine sans sport = 0 pts !", "error");
                                updateDoc(userRef, { points: 0 });
                            }
                            if (d.weeklyWorkouts > 0 && refDate < startOfWeek) {
                                updateDoc(userRef, { weeklyWorkouts: 0 });
                            }
                        }
                    } else {
                        setDoc(userRef, { name: username, points: 0, totalWorkouts: 0, weeklyWorkouts: 0, joinedAt: serverTimestamp(), avatarId: 'classic' });
                        setShowAvatar(true);
                    }
                }, (err) => { console.error("Permission error on user doc", err); });
                
                const qP = query(collection(db, 'duck_purchases'), where('userLowName', '==', username.toLowerCase()), where('status', '==', 'pending'));
                const unsubP = onSnapshot(qP, (s) => setPurchases(s.docs.map(d => ({id:d.id, ...d.data()}))));
                return () => { unsubUser(); unsubP(); };
            }, [user, username, fbLoaded, db]);

            useEffect(() => {
                if (!fbLoaded || !user || !db) return;
                const { onSnapshot, collection, query, where } = window.firebaseModules;
                const unsubR = onSnapshot(collection(db, 'duck_rewards'), (s) => setRewards(s.docs.map(d => ({id:d.id, ...d.data()}))));
                let unsubV = () => {}, unsubD = () => {};
                if (isDaddy) {
                    unsubV = onSnapshot(query(collection(db, 'duck_validations'), where('status', '==', 'pending')), (s) => setValidations(s.docs.map(d => ({id:d.id, ...d.data()}))));
                    unsubD = onSnapshot(query(collection(db, 'duck_purchases'), where('status', '==', 'pending')), (s) => setDeliveries(s.docs.map(d => ({id:d.id, ...d.data()}))));
                }
                return () => { unsubR(); unsubV(); unsubD(); };
            }, [fbLoaded, isDaddy, user, db]);

            // --- STREAMING_CHUNK:Auth and Callbacks... ---
            const handleAuth = async (e) => {
                e.preventDefault();
                const { createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, doc, getDoc, setDoc, serverTimestamp, updateDoc, signInAnonymously } = window.firebaseModules;
                const email = e.target.email.value.trim();
                const password = e.target.password.value;
                const name = e.target.name ? e.target.name.value.trim().replace(/[/#\.\[\]\*\`]/g, '') : "";
                
                if (email.toLowerCase() === "daddy duck" && password === "69") {
                    try {
                        const cred = await signInAnonymously(auth);
                        await updateProfile(cred.user, { displayName: 'Daddy Duck' });
                        await setDoc(doc(db, 'duck_users', 'daddy duck'), { name: 'Daddy Duck', points: 0, totalWorkouts: 0, avatarId: 'classic' }, { merge: true });
                        setUsername('Daddy Duck');
                        setTab('admin');
                        notify("Connecté en tant que Daddy Duck !", "success");
                    } catch (err) { notify("Activez la connexion anonyme sur Firebase.", "error"); }
                    return;
                }

                try {
                    if (isRegistering) {
                        if (!name) return notify("Nom invalide", "error");
                        const userCred = await createUserWithEmailAndPassword(auth, email, password);
                        await updateProfile(userCred.user, { displayName: name });
                        
                        const userRef = doc(db, 'duck_users', name.toLowerCase());
                        const snap = await getDoc(userRef);
                        if (!snap.exists()) {
                            await setDoc(userRef, { name: name, email: email, points: 0, totalWorkouts: 0, weeklyWorkouts: 0, joinedAt: serverTimestamp(), avatarId: 'classic' });
                        } else {
                            await updateDoc(userRef, { email: email });
                        }
                        setUsername(name);
                        notify("Compte sécurisé et connecté !", "success");
                    } else {
                        const userCred = await signInWithEmailAndPassword(auth, email, password);
                        if (userCred.user.displayName) setUsername(userCred.user.displayName);
                        notify("Connexion réussie !", "success");
                    }
                } catch (err) {
                    if (err.code === 'auth/operation-not-allowed') {
                        notify("Erreur: Activez l'authentification Email/Mot de passe sur Firebase.", "error");
                    } else if (err.code === 'auth/email-already-in-use') {
                        notify("Cet email est déjà utilisé.", "error");
                    } else if (err.code === 'auth/invalid-credential') {
                        notify("Email ou mot de passe incorrect.", "error");
                    } else {
                        notify("Erreur d'authentification.", "error");
                    }
                }
            };

            const handleLogout = async () => {
                const { signOut } = window.firebaseModules;
                try { await signOut(auth); } catch(e) { notify("Erreur lors de la déconnexion", "error"); }
            };

            const handleFile = async (e) => { 
                if (e.target.files[0]) { 
                    try { setPhoto(await compressImage(e.target.files[0])); } 
                    catch(err) { notify("Erreur image", "error"); } 
                } 
            };
            
            const sendPhoto = async () => {
                if (!userData || !photo) return;
                const { addDoc, collection, serverTimestamp } = window.firebaseModules;
                try { 
                    const exercisesList = [];
                    if (sport === 'Muscu') {
                        Object.keys(fundChecked).forEach(k => { if(fundChecked[k].w && fundChecked[k].r) exercisesList.push({ name: k, weight: fundChecked[k].w, reps: fundChecked[k].r }); });
                    }

                    await addDoc(collection(db, 'duck_validations'), { 
                        userName: username, userLowName: username.toLowerCase(), 
                        photoBase64: photo, status: 'pending', type: 'workout',
                        sport: sport,
                        intensity: intensity, exercises: exercisesList,
                        dateStr: new Date().toISOString().split('T')[0],
                        timestamp: serverTimestamp(), userAvatar: userData.avatarId 
                    }); 
                    setPhoto(null); setFundChecked({}); setIntensity(5); setSport('Muscu'); notify("Envoyé pour validation !", "success"); 
                } catch(e) { notify("Erreur envoi", "error"); }
            };

            const adminPoints = async (userLowName, amt) => {
                const { updateDoc, doc, increment } = window.firebaseModules;
                await updateDoc(doc(db, 'duck_users', userLowName), { points: increment(amt) });
                notify(`Points modifiés (${amt})`, "success");
            };

            const setAsPhotoOfMonth = async (post) => {
                const { setDoc, doc, updateDoc, increment } = window.firebaseModules;
                try {
                    await setDoc(doc(db, 'duck_misc', 'photo_of_month'), { photoBase64: post.photoBase64, userName: post.userName });
                    await updateDoc(doc(db, 'duck_users', post.userLowName), { points: increment(1) });
                    notify("Photo du mois définie ! (+1 pt)", "success");
                } catch(e) { notify("Erreur", "error"); }
            };

            const validate = async (val, status) => {
                const { updateDoc, doc, increment, serverTimestamp, addDoc, collection } = window.firebaseModules;
                try {
                    await updateDoc(doc(db, 'duck_validations', val.id), { status });
                    if (status === 'approved') { 
                        const uRef = doc(db, 'duck_users', val.userLowName); 
                        await updateDoc(uRef, { points: increment(1), weeklyWorkouts: increment(1), totalWorkouts: increment(1), lastWorkout: serverTimestamp() }); 
                        if (val.exercises && val.exercises.length > 0) {
                            for (let ex of val.exercises) {
                                await addDoc(collection(db, 'duck_pbs'), { userLowName: val.userLowName, exercise: ex.name, weight: parseFloat(ex.weight), reps: parseInt(ex.reps), recordDate: val.dateStr, date: val.timestamp });
                            }
                        }
                        notify("Séance validée !", "success"); 
                    } else {
                        notify("Séance refusée.", "info");
                    }
                } catch(e) { notify("Erreur", "error"); }
            };

            const deliver = async (p) => {
                const { updateDoc, doc } = window.firebaseModules;
                try {
                    await updateDoc(doc(db, 'duck_purchases', p.id), { status: 'delivered' });
                    notify("Livré !", "success");
                } catch(e) { notify("Erreur", "error"); }
            };

            const buy = async (item) => {
                const { updateDoc, doc, increment, addDoc, collection, serverTimestamp } = window.firebaseModules;
                if (userData.points < item.cost) return notify("Pas assez de canards", "error"); 
                await updateDoc(doc(db, 'duck_users', username.toLowerCase()), { points: increment(-item.cost) }); 
                await addDoc(collection(db, 'duck_purchases'), { userName: username, userLowName: username.toLowerCase(), itemName: item.name, itemCost: item.cost, status: 'pending', timestamp: serverTimestamp() }); 
                notify("Acheté !", "success"); 
            };
            
            const changeAvatar = async (k) => {
                const { updateDoc, doc } = window.firebaseModules;
                await updateDoc(doc(db, 'duck_users', username.toLowerCase()), { avatarId: k }); 
                setShowAvatar(false); 
                notify("Avatar changé !", "success"); 
            };

            // --- STREAMING_CHUNK:Rendering View... ---
            if (error) return <div className="min-h-screen bg-red-50 flex items-center justify-center p-4 text-red-600 font-bold text-center">{error}</div>;
            if (!fbLoaded) return <div className="min-h-screen bg-yellow-50 flex items-center justify-center font-bold text-yellow-600 animate-pulse">Chargement...</div>;
            
            if (!user || !username) return (
                <div className="min-h-screen bg-yellow-400 flex flex-col items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
                        <div className="flex justify-center mb-4"><DuckIcon size={64}/></div>
                        <h1 className="text-3xl font-bold text-gray-800 mb-6">Duck Training</h1>
                        
                        <div className="bg-yellow-50 p-4 rounded-xl text-left text-sm text-yellow-900 mb-6 space-y-2 border border-yellow-200">
                            <h3 className="font-bold text-center mb-2">🦆 Les Règles</h3>
                            <ul className="list-disc list-inside space-y-1">
                                <li>1 Séance validée = <strong>+1 Canard</strong>.</li>
                                <li className="text-red-600 font-bold">1 semaine sans sport = Perte de tous vos Canards !</li>
                            </ul>
                            <div className="mt-3 text-xs italic opacity-90 border-t border-yellow-200 pt-3">
                                <strong>💡 Parce que chaque séance de sport est une victoire</strong>, l'appli est ouverte à tout type de sport pourvu que ça soit intense, donnez votre max ! <br/><br/>Indiquez par la photo, si ce n'est pas une séance de muscu, une petite preuve de votre intensité d'entraînement.
                            </div>
                        </div>
                        
                        <form onSubmit={handleAuth} className="space-y-4">
                            {isRegistering && <input name="name" className="w-full p-4 border-2 border-yellow-200 rounded-xl outline-none focus:border-yellow-500" placeholder="Ton Prénom / Pseudo" required />}
                            <input name="email" type="text" className="w-full p-4 border-2 border-yellow-200 rounded-xl outline-none focus:border-yellow-500" placeholder="Adresse Email (ou Daddy Duck)" required />
                            <input name="password" type="password" className="w-full p-4 border-2 border-yellow-200 rounded-xl outline-none focus:border-yellow-500" placeholder="Mot de passe" required minLength={2} />
                            
                            <button className="w-full py-4 rounded-xl font-bold bg-black text-white hover:bg-gray-800 transition">
                                {isRegistering ? "Créer mon compte" : "Se connecter"}
                            </button>
                        </form>
                        
                        <button onClick={() => setIsRegistering(!isRegistering)} className="mt-6 text-sm font-bold text-gray-500 hover:text-gray-800 underline">
                            {isRegistering ? "Déjà un compte ? Se connecter" : "Ancien compte à récupérer / Pas de compte ? S'inscrire"}
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-gray-50 pb-24 relative font-sans">
                    {notif && <div className={`fixed top-4 left-4 right-4 z-50 p-4 rounded-xl shadow-lg text-white font-bold flex items-center gap-3 animate-bounce-in ${notif.type==='error'?'bg-red-500':notif.type==='success'?'bg-green-600':'bg-blue-600'}`}>{notif.type==='error'?<Icons.AlertTriangle/>:<Icons.Info/>} {notif.msg}</div>}
                    {showAvatar && <div className="fixed inset-0 bg-yellow-400 z-50 flex flex-col items-center justify-center p-4 overflow-y-auto"><div className="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-lg text-center my-auto"><h2 className="text-2xl font-black text-gray-800 mb-4">Choisis ton canard</h2><div className="grid grid-cols-3 gap-4">{Object.entries(DUCK_VARIANTS).map(([k, v]) => <button key={k} onClick={() => changeAvatar(k)} className="flex flex-col items-center p-2 border rounded hover:bg-yellow-50"><DuckAvatar id={k} size={50}/><span className="text-xs font-bold mt-1">{v.name}</span></button>)}</div></div></div>}
                    
                    <div className="bg-yellow-400 p-6 rounded-b-3xl shadow-lg sticky top-0 z-30">
                        <div className="flex justify-between items-center mb-4"><div className="flex items-center gap-3"><div className="bg-white p-1 rounded-full shadow-sm cursor-pointer" onClick={() => setShowAvatar(true)}><DuckAvatar id={userData?.avatarId} size={40}/></div><span className="font-bold text-lg flex items-center gap-2">{username} <Icons.Edit2 size={14}/></span></div><button onClick={handleLogout}><Icons.LogOut size={20}/></button></div>
                        {userData && <div><div className="flex justify-between items-end text-white"><div><p className="text-yellow-900 font-medium opacity-80">Mes Points</p><div className="flex items-center gap-2 text-4xl font-black text-black"><DuckIcon size={32}/> {userData.points}</div></div></div>{purchases.length > 0 && <div className="mt-4 bg-yellow-500/20 p-2 rounded text-xs font-bold text-yellow-900 flex gap-2 overflow-x-auto">{purchases.map(p => <span key={p.id} className="bg-white px-2 py-1 rounded shadow-sm shrink-0">{p.itemName}</span>)}</div>}</div>}
                    </div>

                    <TopBanners db={db} isDaddyDuck={isDaddy} notify={notify} />

                    <div className="p-4 max-w-md mx-auto space-y-6 mt-2">
                        {isDaddy && activeTab === 'admin' && <div className="space-y-6">
                            <div><h3 className="font-bold text-lg mb-2">Points manuels</h3><div className="bg-white rounded-xl shadow-sm border p-2">{allUsers.map((u, i)=><div key={u.id || i} className="flex justify-between items-center p-2 border-b"><span className="font-bold">{u.name} ({u.points})</span><div className="flex gap-2"><button onClick={()=>adminPoints(u.name.toLowerCase(), -1)} className="bg-red-100 text-red-600 px-3 rounded font-bold">-1</button><button onClick={()=>adminPoints(u.name.toLowerCase(), 1)} className="bg-green-100 text-green-700 px-3 rounded font-bold">+1</button></div></div>)}</div></div>
                            <div><h3 className="font-bold text-lg mb-2">Validations ({validations.length})</h3>{validations.map(v => <div key={v.id} className="bg-white p-3 rounded-xl shadow-sm border mb-4"><div className="flex justify-between mb-2"><span className="font-bold text-lg">{v.userName}</span><span className="text-xs text-gray-400">{v.timestamp?.toDate().toLocaleTimeString()}</span></div><img src={v.photoBase64} className="rounded mb-2 max-h-48 object-contain bg-black w-full"/>
                            <div className="flex justify-between items-center mt-2 mb-2">
                                <span className="bg-gray-100 px-2 py-1 rounded text-xs font-bold border">{SPORT_EMOJIS[v.sport || 'Muscu']} {v.sport || 'Muscu'}</span>
                                {v.intensity && <span className="text-xs font-bold text-red-600">Intensité: {v.intensity}/10</span>}
                            </div>
                            {v.exercises && v.exercises.map((ex,i)=><p key={i} className="text-xs">💪 {ex.name}: {ex.weight}kg x {ex.reps}</p>)}
                            <div className="flex gap-2 mt-2"><button onClick={() => validate(v, 'rejected')} className="flex-1 border border-red-200 text-red-600 py-2 rounded font-bold">Refuser</button><button onClick={() => validate(v, 'approved')} className="flex-1 bg-yellow-400 py-2 rounded font-bold">Valider</button></div></div>)}</div>
                            <div><h3 className="font-bold text-lg mb-2">Livraisons ({deliveries.length})</h3>{deliveries.map(p => <div key={p.id} className="bg-blue-50 p-3 rounded-xl flex justify-between items-center mb-2"><div><p className="font-bold">{p.userName}</p><p className="text-sm">{p.itemName}</p></div><button onClick={() => deliver(p)} className="bg-blue-600 text-white px-3 py-1 rounded">Livré</button></div>)}</div>
                        </div>}
                        
                        {activeTab === 'feed' && <FeedSection db={db} isDaddyDuck={isDaddy} notify={notify} username={username} setPhotoOfMonth={setAsPhotoOfMonth} />}
                        {activeTab === 'shop' && <ShopSection rewards={rewards} userData={userData} handleBuy={buy} isDaddyDuck={isDaddy} db={db} notify={notify} username={username} />}
                        {activeTab === 'pbs' && <PBSection currentUser={username} isDaddyDuck={isDaddy} db={db} notify={notify} />}
                        {activeTab === 'leader' && <Leaderboard db={db} isDaddyDuck={isDaddy} notify={notify} users={allUsers} setPhotoOfMonth={setAsPhotoOfMonth} />}

                        {activeTab === 'home' && <div className="space-y-4">
                            <div className="p-6 rounded-2xl shadow-sm border text-center bg-white">
                                <h2 className="text-xl font-bold mb-4">Valider une séance</h2>
                                {!photo ? <div className="border-2 border-dashed rounded-xl p-8 relative cursor-pointer bg-white hover:bg-gray-50 transition-colors"><input type="file" accept="image/*" className="absolute inset-0 opacity-0 w-full h-full cursor-pointer" onChange={handleFile}/><Icons.Camera className="mx-auto text-gray-400" size={32}/><p className="mt-2 text-sm font-bold text-gray-500">Prends ta photo</p></div> 
                                : <div className="space-y-4"><div className="relative rounded overflow-hidden bg-black"><img src={photo} className="w-full h-48 object-contain"/><button onClick={() => setPhoto(null)} className="absolute top-2 right-2 bg-white/80 p-1 rounded-full text-red-500"><Icons.Trash2/></button></div>
                                    <div className="space-y-4 text-left mt-4 border-t pt-4">
                                        <div>
                                            <label className="font-bold text-sm mb-2 block text-gray-700">Type de séance</label>
                                            <select className="w-full border p-3 rounded-xl text-sm bg-gray-50 font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400" value={sport} onChange={e => setSport(e.target.value)}>
                                                {SPORTS_LIST.map(s => <option key={s} value={s}>{SPORT_EMOJIS[s]} {s}</option>)}
                                            </select>
                                        </div>
                                        <div><label className="font-bold text-sm flex justify-between text-gray-700">Intensité ressentie <span className="text-red-500">{intensity}/10</span></label><input type="range" min="1" max="10" value={intensity} onChange={e=>setIntensity(e.target.value)} className="w-full mt-2" /></div>
                                        {sport === 'Muscu' && (
                                            <div><label className="font-bold text-sm mb-2 block text-gray-700">As-tu fait ces exos (facultatif) ?</label>
                                                {FUNDAMENTALS_LIST.map(ex => (
                                                    <div key={ex} className="mb-2 bg-gray-50 p-3 rounded-xl border border-gray-200">
                                                        <label className="flex items-center gap-3 text-sm font-bold text-gray-800"><input type="checkbox" className="w-4 h-4 text-yellow-500 rounded focus:ring-yellow-400" checked={!!fundChecked[ex]} onChange={e => { if(!e.target.checked) { let copy={...fundChecked}; delete copy[ex]; setFundChecked(copy); } else setFundChecked({...fundChecked, [ex]:{w:'',r:''}}); }}/> {ex}</label>
                                                        {fundChecked[ex] && <div className="flex gap-2 mt-3"><input type="number" placeholder="Kg" className="w-1/2 p-2 border rounded-lg text-sm bg-white" value={fundChecked[ex].w} onChange={e=>setFundChecked({...fundChecked, [ex]:{...fundChecked[ex], w:e.target.value}})}/><input type="number" placeholder="Reps" className="w-1/2 p-2 border rounded-lg text-sm bg-white" value={fundChecked[ex].r} onChange={e=>setFundChecked({...fundChecked, [ex]:{...fundChecked[ex], r:e.target.value}})}/></div>}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <button onClick={sendPhoto} className="w-full font-bold py-4 rounded-xl shadow-md bg-yellow-400 text-black hover:bg-yellow-500 transition-colors">Envoyer pour validation</button>
                                </div>}
                            </div>
                        </div>}
                    </div>

                    <div className="fixed bottom-0 w-full bg-white border-t p-2 flex justify-around items-center pb-6 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        {isDaddy ? <><NavButton active={activeTab==='admin'} onClick={()=>setTab('admin')} icon={<Icons.CheckCircle/>} label="Admin"/><NavButton active={activeTab==='feed'} onClick={()=>setTab('feed')} icon={<Icons.Home/>} label="Feed"/><NavButton active={activeTab==='home'} onClick={()=>setTab('home')} icon={<Icons.Activity/>} label="Train"/><NavButton active={activeTab==='pbs'} onClick={()=>setTab('pbs')} icon={<Icons.TrendingUp/>} label="Stats"/><NavButton active={activeTab==='shop'} onClick={()=>setTab('shop')} icon={<Icons.ShoppingBag/>} label="Shop"/><NavButton active={activeTab==='leader'} onClick={()=>setTab('leader')} icon={<Icons.Trophy/>} label="Top"/></> : 
                        <><NavButton active={activeTab==='feed'} onClick={()=>setTab('feed')} icon={<Icons.Home/>} label="Accueil"/><NavButton active={activeTab==='home'} onClick={()=>setTab('home')} icon={<Icons.Activity/>} label="Train"/><NavButton active={activeTab==='pbs'} onClick={()=>setTab('pbs')} icon={<Icons.TrendingUp/>} label="Progrès"/><NavButton active={activeTab==='shop'} onClick={()=>setTab('shop')} icon={<Icons.ShoppingBag/>} label="Shop"/><NavButton active={activeTab==='leader'} onClick={()=>setTab('leader')} icon={<Icons.Trophy/>} label="Top"/></>}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><Main /></ErrorBoundary>);
    </script>
</body>
</html>
