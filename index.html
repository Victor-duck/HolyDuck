            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 600; 
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX/w; w = MAX; } } else { if (h > MAX) { w *= MAX/h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = () => reject(new Error("Image invalide"));
            };
            reader.onerror = () => reject(new Error("Erreur lecture"));

            const w = 300, h = 200, pad = 25;
            // Echelle dynamique en fonction du poids max enregistré
            const maxW = Math.max(...data.map(d => d.weight), 10) * 1.2;
            
            // X est réparti chronologiquement de gauche (plus ancien) à droite (plus récent)
            const getX = i => pad + (i / Math.max(data.length - 1, 1)) * (w - 2 * pad);
            const getY = wg => h - pad - (wg / maxW) * (h - 2 * pad);
            
            return (
                <div className="w-full overflow-hidden bg-gray-50 rounded-lg border border-gray-100 relative">
                    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
                        {[0, maxW/2, maxW].map((wg, i) => (
                            <g key={i}>
                                <line x1={pad} y1={getY(wg)} x2={w-pad} y2={getY(wg)} stroke="#e5e7eb" strokeWidth="1" />
                                <text x={pad-2} y={getY(wg)+3} textAnchor="end" fontSize="8" fill="#9ca3af">{Math.round(wg)}</text>
                            </g>
                        ))}
                        <text x={w/2} y={h-5} textAnchor="middle" fontSize="10" fill="#9ca3af">Temps (Évolution des séances)</text>
                        {data.length > 1 && <polyline points={data.map((d, i) => `${getX(i)},${getY(d.weight)}`).join(' ')} fill="none" stroke="#FACC15" strokeWidth="2" />}
                        {data.map((d, i) => (
                            <circle key={i} cx={getX(i)} cy={getY(d.weight)} r="4" fill="#FACC15" stroke="black" strokeWidth="1">
                                <title>{d.weight}kg x {d.reps} ({new Date(d.date?.seconds*1000).toLocaleDateString()})</title>
                            </circle>
                        ))}
                    </svg>
                </div>
            );
        };

        const IntensityChart = ({ validations }) => {
            const w = 300, h = 150, pad = 20;
            // Sort validations by date
            const sorted = [...validations].sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)).filter(v => v.intensity);
            if (sorted.length < 2) return <div className="text-center text-sm text-gray-400 py-4">Pas assez de données</div>;
            
            const getX = i => pad + (i / (sorted.length - 1)) * (w - 2*pad);
            const getY = val => h - pad - ((val - 1) / 9) * (h - 2*pad); // Int 1 to 10
            const pts = sorted.map((v, i) => `${getX(i)},${getY(v.intensity)}`).join(' ');

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto bg-gray-50 rounded-lg border border-gray-100">
                    {[1, 5, 10].map(y => <line key={y} x1={pad} y1={getY(y)} x2={w-pad} y2={getY(y)} stroke="#e5e7eb" strokeWidth="1"/>)}
                    <text x={5} y={getY(10)+5} fontSize="8" fill="#9ca3af">10</text>
                    <text x={5} y={getY(1)+5} fontSize="8" fill="#9ca3af">1</text>
                    <polyline points={pts} fill="none" stroke="#EF4444" strokeWidth="2" />
                    {sorted.map((v, i) => <circle key={i} cx={getX(i)} cy={getY(v.intensity)} r="3" fill="#EF4444"><title>Intensité: {v.intensity}</title></circle>)}
                </svg>
            );
        };

        const PBSection = ({ currentUser, isDaddyDuck, db, notify }) => {
            const [ex, setEx] = useState(EXERCISES_LIST[0]);
            const [spider, setSpider] = useState({});
            const [users, setUsers] = useState([]);
            const [target, setTarget] = useState(currentUser);
            const [allVals, setAllVals] = useState([]);
            const [allPbs, setAllPbs] = useState([]);

            useEffect(() => {
                if (isDaddyDuck) {
                    window.firebaseModules.getDocs(window.firebaseModules.query(window.firebaseModules.collection(db, 'duck_users'))).then(s => {
                        const l = s.docs.map(doc => doc.data().name); setUsers(l); if (l.length && target === 'Daddy Duck') setTarget(l[0]);
                    });
                } else setTarget(currentUser);
            }, [isDaddyDuck]);

            useEffect(() => {
                if (!target) return;
                const unsubPB = window.firebaseModules.onSnapshot(window.firebaseModules.query(window.firebaseModules.collection(db, 'duck_pbs'), window.firebaseModules.where('userLowName', '==', target.toLowerCase())), (s) => {
                    const all = s.docs.map(d => d.data());
                    setAllPbs(all);
                    
                    // Calcul pour le Spider Chart
                    const byEx = {}; EXERCISES_LIST.forEach(e => byEx[e] = 0);
                    all.forEach(p => { const s = p.weight * (p.reps || 1); if(s > byEx[p.exercise]) byEx[p.exercise] = s; });
                    setSpider(byEx);
                });
                const unsubVal = window.firebaseModules.onSnapshot(window.firebaseModules.query(window.firebaseModules.collection(db, 'duck_validations'), window.firebaseModules.where('userLowName', '==', target.toLowerCase())), (s) => {
                    setAllVals(s.docs.map(d => d.data()).filter(v => v.type === 'workout'));
                });
                return () => { unsubPB(); unsubVal(); };
            }, [target]);

            // Filtrage des données du graphe chronologique en fonction de l'exercice selectionné
            const hist = allPbs.filter(i => i.exercise === ex).sort((a,b) => (a.date?.seconds || 0) - (b.date?.seconds || 0));
            const currentMax = hist.length > 0 ? Math.max(...hist.map(h => h.weight)) : 0;

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center px-2">
                        <h2 className="text-2xl font-bold flex gap-2"><Icons.TrendingUp className="text-yellow-500"/> Stats</h2>
                        {isDaddyDuck && <select className="border rounded p-2" value={target} onChange={e => setTarget(e.target.value)}>{users.map(u => <option key={u} value={u}>{u}</option>)}</select>}
                    </div>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm"><h3 className="text-center font-bold mb-4 text-sm text-gray-600">Forces globales (Poids x Reps)</h3><div className="flex justify-center"><SpiderChart data={spider} /></div></div>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm"><h3 className="font-bold mb-4 text-sm text-gray-600 flex items-center gap-2"><Icons.Flame size={16} className="text-red-500"/> Historique d'intensité</h3><IntensityChart validations={allVals}/></div>
                    
                    {/* NOUVEAU GRAPHIQUE DES POIDS MOOVED OVER TIME */}
                    <div className="bg-white p-4 rounded-2xl border shadow-sm">
                        <h3 className="font-bold mb-4 text-sm text-gray-600 flex items-center gap-2"><Icons.Dumbbell size={16} className="text-blue-500"/> Évolution par exercice</h3>
                        <select className="w-full border p-2 rounded mb-4 text-sm bg-gray-50 font-bold" value={ex} onChange={e => setEx(e.target.value)}>
                            {EXERCISES_LIST.map(o => <option key={o} value={o}>{o}</option>)}
                        </select>
                        
                        {hist.length > 0 ? (
                            <div>
                                <div className="flex justify-between items-end mb-2">
                                    <span className="font-bold text-gray-800">{ex}</span>
                                    <span className="text-lg font-black text-yellow-500">Max: {currentMax}kg</span>
                                </div>
                                <ScatterChart data={hist} />
                            </div>
                        ) : (
                            <div className="text-center py-6 text-gray-400 text-sm border-2 border-dashed rounded-xl">Aucune donnée pour cet exercice</div>
                        )}
                    </div>
                </div>
            );
        };

        const CardioTab = ({ db, isDaddyDuck, notify, users }) => {
            const [photos, setPhotos] = useState([]);
            useEffect(() => {
                const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'duck_validations'), window.firebaseModules.where('status', '==', 'approved'));
                const unsub = window.firebaseModules.onSnapshot(q, snap => {
                    const cardioPhotos = snap.docs.map(d => ({id:d.id,...d.data()})).filter(p => p.type === 'cardio').sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                    setPhotos(cardioPhotos);
                });
                return () => unsub();
            }, [db]);

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold px-2 text-blue-600 flex items-center gap-2"><Icons.Activity/> Cardio Zone</h2>
                    <div className="bg-white rounded-2xl border border-blue-100 p-4 shadow-sm space-y-4">
                        <h3 className="font-bold text-sm text-blue-800">Progression vers le Duck Point (4 séances)</h3>
                        {users.map(u => (
                            <div key={u.name} className="flex items-center gap-3">
                                <DuckAvatar id={u.avatarId} size={28}/>
                                <div className="flex-1">
                                    <div className="flex justify-between text-xs font-bold mb-1"><span className="text-gray-700">{u.name}</span><span className="text-blue-600">{u.cardioCount || 0}/4</span></div>
                                    <div className="w-full bg-gray-100 rounded-full h-2 overflow-hidden"><div className="bg-blue-500 h-2 transition-all duration-500" style={{width: `${((u.cardioCount || 0)/4)*100}%`}}></div></div>
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="space-y-4">
                        <h3 className="font-bold px-2 text-blue-800">Galerie Cardio</h3>
                        <div className="grid grid-cols-2 gap-2">
                            {photos.map(p => (
                                <div key={p.id} className="relative aspect-square bg-blue-50 rounded-xl overflow-hidden border border-blue-100 shadow-sm">
                                    <img src={p.photoBase64} className="w-full h-full object-cover"/>
                                    <div className="absolute bottom-0 left-0 right-0 bg-blue-900/60 p-1 text-white text-[10px] font-bold text-center">{p.userName}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const Leaderboard = ({ db, isDaddyDuck, notify, users, setPhotoOfMonth }) => {
            const [allPhotos, setAllPhotos] = useState([]);
            useEffect(() => {
                const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'duck_validations'), window.firebaseModules.where('status', '==', 'approved'));
                return window.firebaseModules.onSnapshot(q, (s) => {
                    const photos = s.docs.map(d => ({id: d.id, ...d.data()})).filter(p => p.type !== 'cardio');
                    photos.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                    setAllPhotos(photos);
                });
            }, [db]);
            return (
                <div className="space-y-8">
                    <div className="space-y-4">
                        <h2 className="text-2xl font-bold px-2">Classement</h2>
                        <div className="bg-white rounded-2xl border overflow-hidden">
                            {users.map((u, i) => (
                                <div key={u.name} className="flex justify-between p-4 border-b">
                                    <div className="flex items-center gap-4"><span className="font-bold w-6 text-center">{i+1}</span><div className="flex items-center gap-3"><DuckAvatar id={u.avatarId} size={32}/><div><p className="font-bold">{u.name}</p><p className="text-xs text-gray-500">{u.totalWorkouts||0} séances</p></div></div></div>
                                    <div className="flex items-center gap-3"><span className="font-bold text-yellow-600 flex gap-1">{u.points} <DuckIcon size={14}/></span></div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="space-y-4">
                        <h2 className="text-2xl font-bold px-2">Galerie du mois</h2>
                        <div className="grid grid-cols-3 gap-1">
                            {allPhotos.map(p => (
                                <div key={p.id} className="relative aspect-square bg-gray-100 overflow-hidden group">
                                    <img src={p.photoBase64} alt={p.userName} className="w-full h-full object-cover" loading="lazy" />
                                    <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex flex-col justify-between p-1 transition-opacity">
                                        <div className="flex justify-end">
                                            {isDaddyDuck && (
                                                <button onClick={() => setPhotoOfMonth(p)} className="text-yellow-300 hover:text-yellow-500 bg-black/50 rounded-full p-1 m-1" title="Définir comme Coin-graphie">
                                                    <Icons.Star size={16}/>
                                                </button>
                                            )}
                                        </div>
                                        <span className="text-white text-xs font-bold truncate w-full">{p.userName}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const Main = () => {
            const [fbLoaded, setFb] = useState(false);
            const [error, setError] = useState(null);
            const services = useRef({});
            const [user, setUser] = useState(null);
            const [username, setUsername] = useState('');
            const [userData, setUserData] = useState(null);
            const [activeTab, setTab] = useState('feed');
            const [notif, setNotif] = useState(null);
            const [showAvatar, setShowAvatar] = useState(false);
            
            const [allUsers, setAllUsers] = useState([]);
            const [rewards, setRewards] = useState([]);
            const [validations, setValidations] = useState([]);
            const [deliveries, setDeliveries] = useState([]);
            const [purchases, setPurchases] = useState([]);
            const [permissionError, setPermissionError] = useState(false);

            // Upload states
            const [photo, setPhoto] = useState(null);
            const [isCompressing, setComp] = useState(false);
            const [workoutType, setWorkoutType] = useState('workout'); // 'workout' or 'cardio'
            const [intensity, setIntensity] = useState(5);
            const [fundChecked, setFundChecked] = useState({}); // { 'Squat': {w:'',r:''} }

            const isDaddy = username.toLowerCase() === 'daddy duck';

            const waitForFirebase = () => new Promise(resolve => { if (window.firebaseReady) resolve(); else window.addEventListener('firebase-ready', resolve); });

            useEffect(() => {
                const start = async () => {
                    await waitForFirebase(); hideFallback();
                    const mods = window.firebaseModules;
                    try {
                        if (!mods.getApps().length) mods.initializeApp(firebaseConfig);
                        services.current = { auth: mods.getAuth(), db: mods.getFirestore(), mods };
                        setFb(true);
                        mods.onAuthStateChanged(services.current.auth, (u) => setUser(u));
                        if (!services.current.auth.currentUser) await mods.signInAnonymously(services.current.auth);
                    } catch(e) { setError("Erreur d'initialisation"); }
                }; start();
            }, []);

            const notify = (msg, type = 'info') => { setNotif({ msg, type }); setTimeout(() => setNotif(null), 4000); };
            const db = services.current.db;
            const mods = services.current.mods;

            // Load Users list
            useEffect(() => {
                if(!fbLoaded) return;
                const unsub = mods.onSnapshot(mods.collection(db, 'duck_users'), s => {
                    const u = s.docs.map(d=>d.data()).sort((a,b) => (b.totalWorkouts || 0) - (a.totalWorkouts || 0));
                    setAllUsers(u);
                });
                return () => unsub();
            }, [fbLoaded, db]);

            // User Profile Listener
            useEffect(() => {
                if (!user || !username || !fbLoaded) return;
                const userRef = mods.doc(db, 'duck_users', username.toLowerCase());
                const unsubUser = mods.onSnapshot(userRef, (s) => {
                    if (s.exists()) {
                        const d = s.data(); setUserData(d);
                        if (!d.avatarId && !isDaddy) setShowAvatar(true);
                        
                        // Penalty Logic (1 Week)
                        const now = new Date();
                        const startOfWeek = new Date(now);
                        const day = startOfWeek.getDay();
                        startOfWeek.setDate(startOfWeek.getDate() - day + (day === 0 ? -6 : 1));
                        startOfWeek.setHours(0, 0, 0, 0);

                        const startOfLastWeek = new Date(startOfWeek);
                        startOfLastWeek.setDate(startOfLastWeek.getDate() - 7);

                        let refDate = null;
                        if (d.lastWorkout) refDate = new Date(d.lastWorkout.seconds * 1000);
                        else if (d.joinedAt) refDate = new Date(d.joinedAt.seconds * 1000);

                        if (refDate) {
                            if (refDate < startOfLastWeek && d.points > 0) {
                                notify("1 semaine sans sport = 0 pts !", "error");
                                mods.updateDoc(userRef, { points: 0 });
                            }
                            if (d.weeklyWorkouts > 0 && refDate < startOfWeek) {
                                mods.updateDoc(userRef, { weeklyWorkouts: 0 });
                            }
                        }
                    } else {
                        mods.setDoc(userRef, { name: username, points: 0, totalWorkouts: 0, weeklyWorkouts: 0, cardioCount: 0, joinedAt: mods.serverTimestamp(), avatarId: 'classic' });
                        setShowAvatar(true);
                    }
                }, (err) => { if(err.code === 'permission-denied') setPermissionError(true); });
                const qP = mods.query(mods.collection(db, 'duck_purchases'), mods.where('userLowName', '==', username.toLowerCase()), mods.where('status', '==', 'pending'));
                const unsubP = mods.onSnapshot(qP, (s) => setPurchases(s.docs.map(d => ({id:d.id, ...d.data()}))));
                return () => { unsubUser(); unsubP(); };
            }, [user, username, fbLoaded]);

            // Admin & Public Listeners
            useEffect(() => {
                if (!fbLoaded || !user) return;
                const unsubR = mods.onSnapshot(mods.collection(db, 'duck_rewards'), (s) => setRewards(s.docs.map(d => ({id:d.id, ...d.data()}))));
                let unsubV = () => {}, unsubD = () => {};
                if (isDaddy) {
                    unsubV = mods.onSnapshot(mods.query(mods.collection(db, 'duck_validations'), mods.where('status', '==', 'pending')), (s) => setValidations(s.docs.map(d => ({id:d.id, ...d.data()}))));
                    unsubD = mods.onSnapshot(mods.query(mods.collection(db, 'duck_purchases'), mods.where('status', '==', 'pending')), (s) => setDeliveries(s.docs.map(d => ({id:d.id, ...d.data()}))));
                }
                return () => { unsubR(); unsubV(); unsubD(); };
            }, [fbLoaded, isDaddy, user]);

            const handleLogin = (e) => { e.preventDefault(); let n = e.target.name.value.trim().replace(/[/#\.\[\]\*\`]/g, ''); if (n) { if (n.toLowerCase() === 'daddy duck') setTab('admin'); setUsername(n); } };
            const handleFile = async (e) => { if (e.target.files[0]) { setComp(true); try { setPhoto(await compressImage(e.target.files[0])); } catch(err) { notify("Erreur image", "error"); } setComp(false); } };
            
            const sendPhoto = async () => {
                if (!userData || !photo) return;
                try { 
                    const exercisesList = [];
                    Object.keys(fundChecked).forEach(k => { if(fundChecked[k].w && fundChecked[k].r) exercisesList.push({ name: k, weight: fundChecked[k].w, reps: fundChecked[k].r }); });

                    await mods.addDoc(mods.collection(db, 'duck_validations'), { 
                        userName: username, userLowName: username.toLowerCase(), 
                        photoBase64: photo, status: 'pending', type: workoutType,
                        intensity: workoutType === 'workout' ? intensity : null,
                        exercises: workoutType === 'workout' ? exercisesList : [],
                        dateStr: new Date().toISOString().split('T')[0], // Submission date
                        timestamp: mods.serverTimestamp(), userAvatar: userData.avatarId 
                    }); 
                    setPhoto(null); setFundChecked({}); setIntensity(5); notify("Envoyé pour validation !", "success"); 
                } catch(e) { notify("Erreur envoi", "error"); }
            };

            const adminPoints = async (userLowName, amt) => {
                await mods.updateDoc(mods.doc(db, 'duck_users', userLowName), { points: mods.increment(amt) });
                notify(`Points modifiés (${amt})`, "success");
            };

            const setAsPhotoOfMonth = async (post) => {
                try {
                    await mods.setDoc(mods.doc(db, 'duck_misc', 'photo_of_month'), { photoBase64: post.photoBase64, userName: post.userName });
                    await mods.updateDoc(mods.doc(db, 'duck_users', post.userLowName), { points: mods.increment(1) });
                    notify("Photo du mois définie ! (+1 pt)", "success");
                } catch(e) { notify("Erreur", "error"); }
            };

            const validate = async (val, status) => {
                try {
                    await mods.updateDoc(mods.doc(db, 'duck_validations', val.id), { status });
                    if (status === 'approved') { 
                        const uRef = mods.doc(db, 'duck_users', val.userLowName); 
                        if (val.type === 'cardio') {
                            const uSnap = await mods.getDoc(uRef);
                            let newCount = (uSnap.data().cardioCount || 0) + 1;
                            if (newCount >= 4) {
                                await mods.updateDoc(uRef, { cardioCount: 0, points: mods.increment(1) });
                                await mods.addDoc(mods.collection(db, 'duck_feed_events'), { type: 'cardio_master', userName: val.userName, userAvatar: val.userAvatar, timestamp: mods.serverTimestamp() });
                                notify("Cardio validé! 4/4 (+1 pt)", "success");
                            } else {
                                await mods.updateDoc(uRef, { cardioCount: newCount });
                                notify("Cardio validé!", "success");
                            }
                        } else {
                            await mods.updateDoc(uRef, { points: mods.increment(1), weeklyWorkouts: mods.increment(1), totalWorkouts: mods.increment(1), lastWorkout: mods.serverTimestamp() }); 
                            if (val.exercises && val.exercises.length > 0) {
                                for (let ex of val.exercises) {
                                    await mods.addDoc(mods.collection(db, 'duck_pbs'), { userLowName: val.userLowName, exercise: ex.name, weight: parseFloat(ex.weight), reps: parseInt(ex.reps), recordDate: val.dateStr, date: val.timestamp });
                                }
                            }
                            notify("Séance validée !", "success"); 
                        }
                    } else notify("Refusé.", "info");
                } catch(e) { notify("Erreur", "error"); }
            };

            const buy = async (item) => { if (userData.points < item.cost) return notify("Pas assez de canards", "error"); await mods.updateDoc(mods.doc(db, 'duck_users', username.toLowerCase()), { points: mods.increment(-item.cost) }); await mods.addDoc(mods.collection(db, 'duck_purchases'), { userName: username, userLowName: username.toLowerCase(), itemName: item.name, itemCost: item.cost, status: 'pending', timestamp: mods.serverTimestamp() }); notify("Acheté !", "success"); };
            const changeAvatar = async (k) => { await mods.updateDoc(mods.doc(db, 'duck_users', username.toLowerCase()), { avatarId: k }); setShowAvatar(false); notify("Avatar changé !", "success"); };

            if (error) return <div className="min-h-screen bg-red-50 flex items-center justify-center p-4 text-red-600 font-bold text-center">{error}</div>;
            if (!fbLoaded) return <div className="min-h-screen bg-yellow-50 flex items-center justify-center font-bold text-yellow-600 animate-pulse">Chargement...</div>;
            if (!username) return (
                <div className="min-h-screen bg-yellow-400 flex flex-col items-center justify-center p-4"><div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center"><div className="flex justify-center mb-4"><DuckIcon size={64}/></div><h1 className="text-3xl font-bold text-gray-800 mb-6">Duck Training</h1>
                <div className="bg-yellow-50 p-4 rounded-xl text-left text-sm text-yellow-900 mb-6 space-y-2 border border-yellow-200"><h3 className="font-bold text-center mb-2">🦆 Les Règles</h3><ul className="list-disc list-inside"><li>1 Muscu = <strong>+1 Canard</strong>.</li><li>4 Cardio = <strong>+1 Canard</strong>.</li><li className="text-red-600 font-bold">1 semaine sans sport = 0 pts !</li></ul></div>
                <form onSubmit={handleLogin} className="space-y-4"><input name="name" className="w-full p-4 border-2 border-yellow-200 rounded-xl" placeholder="Ton Prénom" required /><button className={`w-full py-4 rounded-xl font-bold transition ${!user ? 'bg-gray-400 cursor-not-allowed' : 'bg-black text-white'}`} disabled={!user}>Entrer</button></form></div></div>
            );

            return (
                <div className="min-h-screen bg-gray-50 pb-24 relative font-sans">
                    {permissionError && <div className="firebase-error-banner"><strong>Erreur d'accès à la base de données !</strong><span>Console Firebase > Firestore > Règles : <code>allow read, write: if true;</code></span></div>}
                    {notif && <div className={`fixed top-4 left-4 right-4 z-50 p-4 rounded-xl shadow-lg text-white font-bold flex items-center gap-3 animate-bounce-in ${notif.type==='error'?'bg-red-500':notif.type==='success'?'bg-green-600':'bg-blue-600'}`}>{notif.type==='error'?<Icons.AlertTriangle/>:<Icons.Info/>} {notif.msg}</div>}
                    {showAvatar && !isDaddy && <div className="fixed inset-0 bg-yellow-400 z-50 flex flex-col items-center justify-center p-4 overflow-y-auto"><div className="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-lg text-center my-auto"><h2 className="text-2xl font-black text-gray-800 mb-4">Choisis ton canard</h2><div className="grid grid-cols-3 gap-4">{Object.entries(DUCK_VARIANTS).map(([k, v]) => <button key={k} onClick={() => changeAvatar(k)} className="flex flex-col items-center p-2 border rounded hover:bg-yellow-50"><DuckAvatar id={k} size={50}/><span className="text-xs font-bold mt-1">{v.name}</span></button>)}</div></div></div>}
                    
                    <div className="bg-yellow-400 p-6 rounded-b-3xl shadow-lg sticky top-0 z-30">
                        <div className="flex justify-between items-center mb-4"><div className="flex items-center gap-3"><div className="bg-white p-1 rounded-full shadow-sm cursor-pointer" onClick={() => !isDaddy && setShowAvatar(true)}><DuckAvatar id={userData?.avatarId} size={40}/></div><span className="font-bold text-lg flex items-center gap-2">{username} {!isDaddy && <Icons.Edit2 size={14}/>}</span></div><button onClick={() => setUsername('')}><Icons.LogOut size={20}/></button></div>
                        {!isDaddy && userData && <div><div className="flex justify-between items-end text-white"><div><p className="text-yellow-900 font-medium opacity-80">Mes Points</p><div className="flex items-center gap-2 text-4xl font-black text-black"><DuckIcon size={32}/> {userData.points}</div></div></div>{purchases.length > 0 && <div className="mt-4 bg-yellow-500/20 p-2 rounded text-xs font-bold text-yellow-900 flex gap-2 overflow-x-auto">{purchases.map(p => <span key={p.id} className="bg-white px-2 py-1 rounded shadow-sm shrink-0">{p.itemName}</span>)}</div>}</div>}
                    </div>

                    <TopBanners db={db} isDaddyDuck={isDaddy} notify={notify} />

                    <div className="p-4 max-w-md mx-auto space-y-6 mt-2">
                        {isDaddy && activeTab === 'admin' && <div className="space-y-6">
                            <div><h3 className="font-bold text-lg mb-2">Points manuels</h3><div className="bg-white rounded-xl shadow-sm border p-2">{allUsers.map(u=><div key={u.name} className="flex justify-between items-center p-2 border-b"><span className="font-bold">{u.name} ({u.points})</span><div className="flex gap-2"><button onClick={()=>adminPoints(u.name.toLowerCase(), -1)} className="bg-red-100 text-red-600 px-3 rounded font-bold">-1</button><button onClick={()=>adminPoints(u.name.toLowerCase(), 1)} className="bg-green-100 text-green-700 px-3 rounded font-bold">+1</button></div></div>)}</div></div>
                            <div><h3 className="font-bold text-lg mb-2">Validations ({validations.length})</h3>{validations.map(v => <div key={v.id} className={`p-3 rounded-xl shadow-sm border mb-4 ${v.type==='cardio'?'bg-blue-50 border-blue-200':'bg-white'}`}><div className="flex justify-between mb-2"><span className="font-bold text-lg">{v.userName} {v.type==='cardio'&&<Icons.HeartPulse className="inline text-blue-500" size={16}/>}</span><span className="text-xs text-gray-400">{v.timestamp?.toDate().toLocaleTimeString()}</span></div><img src={v.photoBase64} className="rounded mb-2 max-h-48 object-contain bg-black w-full"/>
                            {v.type==='workout' && v.intensity && <p className="text-xs font-bold text-red-600 mb-2">Intensité: {v.intensity}/10</p>}
                            {v.type==='workout' && v.exercises && v.exercises.map((ex,i)=><p key={i} className="text-xs">💪 {ex.name}: {ex.weight}kg x {ex.reps}</p>)}
                            <div className="flex gap-2 mt-2"><button onClick={() => validate(v, 'rejected')} className="flex-1 border border-red-200 text-red-600 py-2 rounded font-bold">Refuser</button><button onClick={() => validate(v, 'approved')} className="flex-1 bg-yellow-400 py-2 rounded font-bold">Valider</button></div></div>)}</div>
                            <div><h3 className="font-bold text-lg mb-2">Livraisons ({deliveries.length})</h3>{deliveries.map(p => <div key={p.id} className="bg-blue-50 p-3 rounded-xl flex justify-between items-center mb-2"><div><p className="font-bold">{p.userName}</p><p className="text-sm">{p.itemName}</p></div><button onClick={() => deliver(p)} className="bg-blue-600 text-white px-3 py-1 rounded">Livré</button></div>)}</div>
                        </div>}
                        
                        {activeTab === 'feed' && <FeedSection db={db} isDaddyDuck={isDaddy} notify={notify} username={username} setPhotoOfMonth={setAsPhotoOfMonth} />}
                        {activeTab === 'program' && <ProgramSection db={db} isDaddyDuck={isDaddy} notify={notify} />}

                        {!isDaddy && activeTab === 'home' && <div className="space-y-4">
                            <div className="flex rounded-xl overflow-hidden shadow-sm border">
                                <button className={`flex-1 py-3 font-bold ${workoutType==='workout'?'bg-yellow-400 text-black':'bg-white text-gray-400'}`} onClick={()=>setWorkoutType('workout')}>Muscu</button>
                                <button className={`flex-1 py-3 font-bold ${workoutType==='cardio'?'bg-blue-500 text-white':'bg-white text-gray-400'}`} onClick={()=>setWorkoutType('cardio')}>Cardio</button>
                            </div>
                            <div className={`p-6 rounded-2xl shadow-sm border text-center ${workoutType==='workout'?'bg-white':'bg-blue-50 border-blue-100'}`}>
                                <h2 className="text-xl font-bold mb-4">{workoutType==='workout' ? 'Valider une séance' : 'Valider un cardio'}</h2>
                                {!photo ? <div className="border-2 border-dashed rounded-xl p-8 relative cursor-pointer bg-white"><input type="file" accept="image/*" className="absolute inset-0 opacity-0 w-full h-full" onChange={handleFile}/><Icons.Camera className="mx-auto text-gray-400" size={32}/><p className="mt-2 text-sm font-bold text-gray-500">Prends ta photo</p></div> 
                                : <div className="space-y-4"><div className="relative rounded overflow-hidden bg-black"><img src={photo} className="w-full h-48 object-contain"/><button onClick={() => setPhoto(null)} className="absolute top-2 right-2 bg-white/80 p-1 rounded-full text-red-500"><Icons.Trash2/></button></div>
                                    {workoutType === 'workout' && (
                                        <div className="space-y-4 text-left mt-4 border-t pt-4">
                                            <div><label className="font-bold text-sm flex justify-between">Intensité <span className="text-red-500">{intensity}/10</span></label><input type="range" min="1" max="10" value={intensity} onChange={e=>setIntensity(e.target.value)} className="w-full mt-2" /></div>
                                            <div><label className="font-bold text-sm mb-2 block">As-tu fait ces exos ?</label>
                                                {FUNDAMENTALS_LIST.map(ex => (
                                                    <div key={ex} className="mb-2 bg-gray-50 p-2 rounded border">
                                                        <label className="flex items-center gap-2 text-sm font-bold"><input type="checkbox" checked={!!fundChecked[ex]} onChange={e => { if(!e.target.checked) { let copy={...fundChecked}; delete copy[ex]; setFundChecked(copy); } else setFundChecked({...fundChecked, [ex]:{w:'',r:''}}); }}/> {ex}</label>
                                                        {fundChecked[ex] && <div className="flex gap-2 mt-2"><input type="number" placeholder="Kg" className="w-1/2 p-2 border rounded text-sm" value={fundChecked[ex].w} onChange={e=>setFundChecked({...fundChecked, [ex]:{...fundChecked[ex], w:e.target.value}})}/><input type="number" placeholder="Reps" className="w-1/2 p-2 border rounded text-sm" value={fundChecked[ex].r} onChange={e=>setFundChecked({...fundChecked, [ex]:{...fundChecked[ex], r:e.target.value}})}/></div>}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    <button onClick={sendPhoto} className={`w-full font-bold py-3 rounded-xl shadow-md ${workoutType==='workout'?'bg-yellow-400 text-black':'bg-blue-600 text-white'}`}>Envoyer</button>
                                </div>}
                            </div>
                        </div>}

                        {activeTab === 'cardio' && <CardioTab db={db} isDaddyDuck={isDaddy} notify={notify} users={allUsers} />}
                        {activeTab === 'shop' && <ShopSection rewards={rewards} userData={userData} handleBuy={buy} isDaddyDuck={isDaddy} db={db} notify={notify} />}
                        {activeTab === 'pbs' && <PBSection currentUser={username} isDaddyDuck={isDaddy} db={db} notify={notify} />}
                        {activeTab === 'leader' && <Leaderboard db={db} isDaddyDuck={isDaddy} notify={notify} users={allUsers} setPhotoOfMonth={setAsPhotoOfMonth} />}
                    </div>

                    <div className="fixed bottom-0 w-full bg-white border-t p-2 flex justify-around items-center pb-6 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        {isDaddy ? <><NavButton active={activeTab==='admin'} onClick={()=>setTab('admin')} icon={<Icons.CheckCircle/>} label="Admin"/><NavButton active={activeTab==='feed'} onClick={()=>setTab('feed')} icon={<Icons.Home/>} label="Feed"/><NavButton active={activeTab==='program'} onClick={()=>setTab('program')} icon={<Icons.FileText/>} label="Prog"/><NavButton active={activeTab==='pbs'} onClick={()=>setTab('pbs')} icon={<Icons.TrendingUp/>} label="Stats"/><NavButton active={activeTab==='shop'} onClick={()=>setTab('shop')} icon={<Icons.ShoppingBag/>} label="Shop"/><NavButton active={activeTab==='leader'} onClick={()=>setTab('leader')} icon={<Icons.Trophy/>} label="Top"/></> : 
                        <><NavButton active={activeTab==='feed'} onClick={()=>setTab('feed')} icon={<Icons.Home/>} label="Accueil"/><NavButton active={activeTab==='program'} onClick={()=>setTab('program')} icon={<Icons.FileText/>} label="Prog"/><NavButton active={activeTab==='home'} onClick={()=>setTab('home')} icon={<Icons.Activity/>} label="Train"/><NavButton active={activeTab==='cardio'} onClick={()=>setTab('cardio')} icon={<Icons.HeartPulse/>} label="Cardio"/><NavButton active={activeTab==='pbs'} onClick={()=>setTab('pbs')} icon={<Icons.TrendingUp/>} label="Progrès"/><NavButton active={activeTab==='shop'} onClick={()=>setTab('shop')} icon={<Icons.ShoppingBag/>} label="Shop"/><NavButton active={activeTab==='leader'} onClick={()=>setTab('leader')} icon={<Icons.Trophy/>} label="Top"/></>}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><Main /></ErrorBoundary>);
    </script>
</body>
</html>
